name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate signing keystore
        # AGP 的 release 构建默认不签名，产出 app-release-unsigned.apk。
        # 这里用 JDK 自带的 keytool 生成一个自签 keystore，仅供 sideload 安装。
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storetype JKS \
            -alias pixel9proims \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Pixel9ProIMS, OU=dev, O=local, L=CN, S=CN, C=CN"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          cp "$UNSIGNED" app-release-signed.apk
          "$BT/zipalign" -f -p 4 app-release-signed.apk app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias pixel9proims \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app-release.apk app-release-aligned.apk
          "$BT/apksigner" verify --print-certs -v app-release.apk | head -20
          ls -l app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
